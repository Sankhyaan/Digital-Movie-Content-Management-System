name: CineVerse Auto-Deploy to AWS EC2

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to Existing AWS EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -euo pipefail

            echo "=== Starting CineVerse Deployment ==="

            # Navigate to CineVerse directory on EC2
            if [ -d "$HOME/cineverse" ]; then
              cd "$HOME/cineverse"
            elif [ -d "/var/www/cineverse" ]; then
              cd "/var/www/cineverse"
            else
              echo "Error: CineVerse directory not found!"
              exit 1
            fi

            # Pull latest changes from main branch
            git pull origin main
            DEPLOYED_COMMIT=$(git rev-parse HEAD)
            echo "Deploying Git Commit: ${DEPLOYED_COMMIT}"

            # Rebuild backend; failure halts execution before pm2 restart
            echo "Building backend..."
            cd backend
            npm install --production=false
            npm run build
            pm2 restart cineverse-backend || pm2 start dist/server.js --name "cineverse-backend"

            # Rebuild frontend production bundle
            echo "Building frontend..."
            cd ../frontend
            npm install
            npm run build

            # Reload Nginx if configured
            if command -v systemctl >/dev/null 2>&1; then
              sudo systemctl reload nginx || true
            fi

            echo "🚀 CineVerse deployment completed successfully! Deployed commit: ${DEPLOYED_COMMIT}"
